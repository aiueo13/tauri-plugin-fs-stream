[package]
name = "tauri-plugin-fs-stream"
version = "0.1.0"
authors = [ "OkaYu" ]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-fs-stream"

[dependencies]
tauri = { version = "2", default-features = false }
serde = "1"
serde_json = "1"
thiserror = "2"
schemars = "0.8"
glob = "0.3"
percent-encoding = "2"
base64 = "0.22"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
schemars = "0.8"
serde = "1"