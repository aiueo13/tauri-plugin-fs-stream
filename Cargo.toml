[package]
name = "tauri-plugin-fs-stream"
version = "0.7.1"
authors = ["OkaYu"]
description = "File Streaming API for Tauri"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-fs-stream"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aiueo13/tauri-plugin-fs-stream"
readme = "README.md"
keywords = ["tauri", "plugin", "file", "fs", "stream"]

[dependencies]
tauri = { version = "2", default-features = false }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "0.8"
glob = "0.3"
base64 = "0.22"
percent-encoding = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
schemars = "0.8"
serde = "1"